server {
    listen 80;
    listen [::]:80;
    server_name contabilitate.greentechpro.ro;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/greentech-financiar-acme;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name contabilitate.greentechpro.ro;
    ssl_certificate /etc/letsencrypt/live/contabilitate.greentechpro.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contabilitate.greentechpro.ro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;
    access_log /var/log/nginx/greentech-financiar.access.log;
    error_log /var/log/nginx/greentech-financiar.error.log;
    location ^~ /web/database { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect off;
        proxy_cookie_flags session_id secure httponly samesite=lax;
    }
}
