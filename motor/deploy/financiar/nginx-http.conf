# ONLY the new domain. Existing vhosts and their files remain separate.
server {
    listen 80;
    listen [::]:80;
    server_name contabilitate.greentechpro.ro;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/greentech-financiar-acme;
    }
    # Keep the app private until HTTPS is configured.
    location / { return 404; }
}
