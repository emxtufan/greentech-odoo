name: greentech-financiar

x-image: &finance-image
  image: greentech-financiar:local-snapshot
  build: .

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - pg-data:/var/lib/postgresql
      - ./runtime/db-admin-password:/run/secrets/db_admin:ro
    networks: [finance]
    mem_limit: 1g
    cpus: 1.0
    shm_size: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  restore:
    <<: *finance-image
    profiles: [setup]
    user: root
    entrypoint: [/opt/finance-venv/bin/python, /opt/finance-tools/container_restore.py]
    volumes:
      - ./backup:/backup:ro
      - ./manifest.json:/manifest.json:ro
      - ./runtime:/run/finance:ro
      - odoo-data:/var/lib/odoo
    networks: [finance]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2.0
    logging: *logging

  odoo:
    <<: *finance-image
    profiles: [app]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8070:8069
    volumes:
      - ./runtime/odoo.conf:/etc/odoo/finance.conf:ro
      - odoo-data:/var/lib/odoo
    networks: [finance]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: [CMD, /opt/finance-venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 4
    logging: *logging

networks:
  finance:
    internal: true
volumes:
  pg-data:
  odoo-data:
